services:
  postgres-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: valpay
      POSTGRES_PASSWORD: valpay_dev
      POSTGRES_DB: valpay
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  pg_data:
  mongo_data:
